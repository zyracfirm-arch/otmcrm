<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTM Kitchen & Owner Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-white flex items-center justify-center p-4">
  <form method="POST" class="w-full max-w-sm rounded-3xl bg-zinc-900 border border-white/10 p-6 space-y-4 shadow-2xl">
    {% csrf_token %}
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-amber-500 text-black font-black flex items-center justify-center">🌙</div>
      <div>
        <h1 class="text-base font-extrabold">OVER THE MOON CRM</h1>
        <p class="text-[11px] text-zinc-400">Authorized Shop Terminal</p>
      </div>
    </div>
    {% if error %}
    <div class="p-3 rounded-xl bg-red-500/20 border border-red-500/30 text-xs text-red-300 font-semibold">{{ error }}</div>
    {% endif %}
    <input type="text" name="username" required placeholder="Staff / Owner Username"
      class="w-full bg-zinc-950 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400">
    <input type="password" name="password" required placeholder="Password"
      class="w-full bg-zinc-950 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400">
    <button type="submit" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-sm">Sign In to Terminal →</button>
  </form>
</body>
</html>
