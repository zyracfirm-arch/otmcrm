<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Staff Vault Login — Over The Moon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #050507; color: #f4f4f5; -webkit-font-smoothing: antialiased; }
    .apple-glass { background: linear-gradient(145deg, rgba(26, 26, 32, 0.85) 0%, rgba(12, 12, 16, 0.96) 100%); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); }
    @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    .astro-float { animation: floatSlow 4s ease-in-out infinite; }
    @keyframes spinOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .orbit-ring { animation: spinOrbit 32s linear infinite; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-yellow-400 selection:text-black">

  <!-- Reusable Astronaut Burger SVG Symbol -->
  <svg class="hidden" aria-hidden="true">
    <symbol id="otm-astronaut" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="28" fill="#FACC15"/>
      <rect x="16" y="38" width="12" height="22" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="4"/>
      <rect x="92" y="38" width="12" height="22" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="4"/>
      <circle cx="60" cy="46" r="34" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="4.5"/>
      <ellipse cx="60" cy="47" rx="26" ry="22" fill="#1E1B4B"/>
      <path d="M40 36 C47 29, 60 29, 68 33" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
      <circle cx="75" cy="49" r="3.5" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="71" cy="57" r="2" fill="#FFFFFF" opacity="0.9"/>
      <path d="M35 76 C35 66, 85 66, 85 76 L90 100 C90 106, 30 106, 30 100 Z" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="4"/>
      <rect x="20" y="86" width="18" height="24" rx="9" fill="#E2E8F0" stroke="#1E1B4B" stroke-width="4"/>
      <rect x="82" y="86" width="18" height="24" rx="9" fill="#E2E8F0" stroke="#1E1B4B" stroke-width="4"/>
      <path d="M38 72 C38 57, 82 57, 82 72 Z" fill="#F59E0B" stroke="#1E1B4B" stroke-width="3.5"/>
      <path d="M36 74 Q48 79 60 74 Q72 79 84 74" stroke="#22C55E" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <polygon points="42,76 60,82 78,76" fill="#FACC15"/>
      <rect x="38" y="77" width="44" height="7" rx="3.5" fill="#78350F" stroke="#1E1B4B" stroke-width="3"/>
      <rect x="40" y="84" width="40" height="7" rx="3.5" fill="#F59E0B" stroke="#1E1B4B" stroke-width="3.5"/>
      <circle cx="40" cy="76" r="8.5" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="3.5"/>
      <circle cx="80" cy="76" r="8.5" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="3.5"/>
    </symbol>
  </svg>

  <!-- Ambient Cosmic Background Glows -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[700px] h-[340px] bg-gradient-to-b from-yellow-400/15 via-amber-500/5 to-transparent blur-3xl pointer-events-none -z-10"></div>
  <div class="fixed -bottom-32 -right-32 w-96 h-96 rounded-full border border-dashed border-yellow-400/15 orbit-ring pointer-events-none -z-10"></div>

  <!-- Main Vault Card -->
  <div class="w-full max-w-md apple-glass border border-white/10 rounded-[36px] p-6 sm:p-9 shadow-2xl relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-yellow-400 via-amber-300 to-emerald-400"></div>

    <!-- Top Security Status & Back Link -->
    <div class="flex items-center justify-between mb-6">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-[10px] font-black text-emerald-400 uppercase tracking-widest">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
        Authorized Shop Hardware
      </span>
      <a href="{% url 'public_menu' %}" class="text-xs font-bold text-zinc-400 hover:text-white transition flex items-center gap-1">
        <span>Storefront</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
      </a>
    </div>

    <!-- Brand Identity Header -->
    <div class="flex items-center gap-4 mb-6">
      <div class="w-16 h-16 rounded-2xl overflow-hidden shadow-xl shadow-yellow-400/20 border-2 border-yellow-400/50 shrink-0 astro-float">
        <svg class="w-full h-full"><use href="#otm-astronaut"/></svg>
      </div>
      <div>
        <p class="text-[10px] font-black uppercase tracking-widest text-yellow-400">Over The Moon Burger</p>
        <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight mt-0.5">Staff Command Vault</h1>
        <p class="text-xs text-zinc-400 font-medium mt-0.5">Chef Ubedulla • Kitchen • Delivery Dispatch</p>
      </div>
    </div>

    <!-- Quick Role Selector Pills (Auto-fills or focuses username) -->
    <div class="mb-5">
      <p class="text-[10px] font-bold uppercase tracking-widest text-zinc-500 mb-2">Quick Select Role</p>
      <div class="grid grid-cols-3 gap-2 p-1 bg-zinc-950 rounded-2xl border border-white/10">
        <button type="button" onclick="selectRole('owner', this)" class="role-pill py-2 rounded-xl text-xs font-black bg-yellow-400 text-black transition flex items-center justify-center gap-1.5 shadow">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <span>Owner</span>
        </button>
        <button type="button" onclick="selectRole('kitchen', this)" class="role-pill py-2 rounded-xl text-xs font-black text-zinc-400 hover:text-white transition flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/></svg>
          <span>Kitchen</span>
        </button>
        <button type="button" onclick="selectRole('rider', this)" class="role-pill py-2 rounded-xl text-xs font-black text-zinc-400 hover:text-white transition flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span>Rider</span>
        </button>
      </div>
    </div>

    {% if error %}
    <div class="mb-5 p-3.5 rounded-2xl bg-red-500/15 border border-red-500/30 flex items-center gap-2.5 text-xs font-bold text-red-400">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="text-[11px] font-bold uppercase tracking-wider text-zinc-400 block mb-1.5">Staff Username</label>
        <div class="relative">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <input id="staffUsername" name="username" required autocomplete="username" placeholder="Enter username (e.g. ubedullah, kitchen)"
            class="w-full bg-zinc-950 border border-white/10 rounded-2xl pl-11 pr-4 py-3.5 text-sm font-bold text-white placeholder-zinc-600 focus:border-yellow-400 focus:outline-none transition">
        </div>
      </div>

      <div>
        <label class="text-[11px] font-bold uppercase tracking-wider text-zinc-400 block mb-1.5">Vault Password</label>
        <div class="relative">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <input id="staffPassword" type="password" name="password" required autocomplete="current-password" placeholder="Enter secret password"
            class="w-full bg-zinc-950 border border-white/10 rounded-2xl pl-11 pr-11 py-3.5 text-sm font-bold text-white placeholder-zinc-600 focus:border-yellow-400 focus:outline-none transition">
          <button type="button" onclick="togglePassword()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-white p-1" title="Show/Hide Password">
            <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="w-full py-4 rounded-2xl bg-yellow-400 hover:bg-yellow-300 text-black font-black text-sm shadow-xl shadow-yellow-400/20 active:scale-[0.98] transition flex items-center justify-center gap-2 mt-2">
        <span>Unlock Command Vault</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>
    </form>

    <!-- Bottom Security Footnote -->
    <div class="mt-6 pt-4 border-t border-white/10 flex items-center justify-between text-[11px] text-zinc-500 font-semibold">
      <span>Protected by Hardware Cookie Lock</span>
      <span>OTM Vault v2.6</span>
    </div>

  </div>

  <script>
    function selectRole(role, btn) {
      document.querySelectorAll('.role-pill').forEach(el => {
        el.className = "role-pill py-2 rounded-xl text-xs font-black text-zinc-400 hover:text-white transition flex items-center justify-center gap-1.5";
      });
      btn.className = "role-pill py-2 rounded-xl text-xs font-black bg-yellow-400 text-black transition flex items-center justify-center gap-1.5 shadow";

      const userField = document.getElementById('staffUsername');
      const passField = document.getElementById('staffPassword');

      if (role === 'kitchen') {
        userField.value = 'kitchen';
        passField.focus();
      } else if (role === 'owner') {
        userField.value = '';
        userField.placeholder = 'Enter Owner Username';
        userField.focus();
      } else {
        userField.value = '';
        userField.placeholder = 'Enter Rider Username (e.g. rider1)';
        userField.focus();
      }
    }

    function togglePassword() {
      const pass = document.getElementById('staffPassword');
      pass.type = pass.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
